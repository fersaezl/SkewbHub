<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkewbHub</title>
    <link rel="icon" type="image/png" href="img/logo.png">

    <meta name="theme-color" content="#0a1220" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/timer.css" />
    <link rel="stylesheet" href="css/cases.css" />
</head>

<body>
    <!-- Navigation bar -->
    <nav class="navbar navbar-expand sh-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img/logo.png" alt="" width="32" height="32" class="me-2">
                <span class="brand-text">SkewbHub</span>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" aria-current="page" href="index.html">Timer</a>
                <a class="nav-link" href="selection.html">Selection</a>
                <a class="nav-link" href="statistics.html">Statistics</a>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="container my-4 d-flex flex-column gap-3">

        <!-- Scramble bar: scramble in the middle, buttons on the right -->
        <section class="sh-card sh-scramble-bar">
            <span class="sh-scramble-spacer"></span>
            <p id="scramble"></p>
            <div class="sh-scramble-actions">
                <button id="btn-prev-scramble" class="btn btn-outline-secondary btn-sm" disabled>Last
                    Scramble</button>
                <button id="btn-next-scramble" class="btn btn-outline-secondary btn-sm">Next Scramble</button>
            </div>
        </section>

        <!-- Timer card: cube on the left, timer and stats on the right -->
        <section class="sh-card">
            <div class="p-3 p-md-4">
                <div class="row align-items-center g-4">

                    <!-- Cube -->
                    <div class="col-12 col-md-5 text-center">
                        <div id="case-image"></div>
                        <p id="case-name" class="mb-0"></p>
                        <div id="skewbs" class="mx-auto"></div>
                    </div>

                    <!-- Timer and stats -->
                    <div class="col-12 col-md-7 text-center">
                        <!-- Only this part reacts to touch (see timer.js) -->
                        <div id="timer-section">
                            <div id="timer">0.00</div>
                            <p id="timer-status">Press space to start</p>
                        </div>

                        <div class="sh-stats">
                            <div class="sh-stat">
                                <span class="sh-stat-label">ao5</span>
                                <span class="sh-stat-value" id="ao5">-</span>
                            </div>
                            <div class="sh-stat">
                                <span class="sh-stat-label">ao12</span>
                                <span class="sh-stat-value" id="ao12">-</span>
                            </div>
                            <div class="sh-stat">
                                <span class="sh-stat-label">PB</span>
                                <span class="sh-stat-value" id="pb">-</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="sh-card-footer">
                <button id="btn-clear" class="btn btn-outline-warning btn-sm">Clear</button>
            </div>
        </section>

        <!-- Table of times -->
        <section class="sh-card overflow-hidden">
            <table class="table align-middle text-center mb-0" id="times-list">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Time</th>
                        <th>ao5</th>
                        <th>ao12</th>
                    </tr>
                </thead>
                <tbody id="times-body">
                </tbody>
            </table>
        </section>

    </main>

    <footer class="text-center text-muted py-3">
        <small>SkewbHub v0.5.0</small>
    </footer>

    <!-- Options for one solve (opens when a row of the table is clicked) -->
    <div class="modal fade" id="solve-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="solve-modal-title">Solve</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="fs-2 mb-3" id="solve-modal-time"></p>
                    <p class="small text-muted text-break mb-3" id="solve-modal-scramble"></p>
                    <div class="btn-group" role="group">
                        <button class="btn btn-outline-success btn-penalty" data-penalty="none">OK</button>
                        <button class="btn btn-outline-warning btn-penalty" data-penalty="plus2">+2</button>
                        <button class="btn btn-outline-danger btn-penalty" data-penalty="dnf">DNF</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-danger me-auto" id="btn-delete-solve">Delete</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery & Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App scripts -->
    <script src="js/cases.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/skewbs.js"></script>
    <script src="js/main.js"></script>
    <!-- Loaded as a module because it uses import -->
    <script type="module" src="js/scrambler.js"></script>
</body>

</html>
